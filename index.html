const TRAITS=['physique','skin','hair','face','speech','clothing','virtue','vice','reputation','misfortunes'];
const GROUPS=['Identity','Traits','Abilities','Equipment','Pack','Sheet'];
const STEPS=[{key:'name',title:'Who enters the unknown?',group:0,info:'Roll a given name and surname, or choose your own. The name tables do not limit your character’s gender.'},{key:'background',title:'A life before adventure',table:'background',group:0,info:'Your background informs your knowledge and skills. Roll a d20 or choose from the table.'},...TRAITS.map((key,i)=>({key,title:['A familiar silhouette','Marked by the world','A little untamed','A face to remember','A voice in the quiet','The clothes you carry','Your better nature','Your darker side','What people say','What haunts you'][i],table:key,group:1,info:`${cap(key)} · Roll a d10 on the character traits table.`})),{key:'age',title:'Years behind you',group:1,info:'Roll 2d20 and add 10. Starting characters are between 12 and 50 years old.'},...['str','dex','wil'].map((key,i)=>({key,title:['Strength','Dexterity','Willpower'][i],group:2,info:['Physical power, endurance, and resistance.','Poise, speed, and reflexes.','Persuasion, determination, and magic.'][i]+' Roll 3d6, in order.'})),{key:'swap',title:'Play to your strengths',group:2,info:'You may swap any two ability scores once, or keep them as rolled.'},{key:'hp',title:'A little protection',group:2,info:'Roll 1d6 for Hit Protection (HP): your ability to avoid damage, not your health.'},{key:'gold',title:'Coins for the road',group:3,info:'Roll 3d6 for your starting gold pieces. You also begin with three days’ rations and a torch.'},...['armor','helmets','weapons','expedition','tools','trinkets','bonus'].map((key,i)=>({key,table:key,group:3,title:['Armor against the dark','Helmets & shields','Something to fight with','For the long road','Tools of the trade','Something in your pocket','One last thing'][i],info:key==='bonus'?'Roll a d20, then roll on the indicated table. Where two tables are offered, choose one.':key==='weapons'?'Roll a d20, then choose one weapon from the resulting group.':'Roll a d20 on the starting gear table.'})),{key:'pack',title:'Pack for the journey',group:4,info:'Ten slots: six in your backpack, two hands, and two upper-body slots. Bulky items use two slots. Leave surplus gear behind or stow it in a cart.'},{key:'sheet',title:'Ready for the unknown',group:5,info:'Your character is ready. Print this sheet and choose “Save as PDF” in your browser’s print dialog.'}];
const STORAGE='cairn-character-v1';
function fresh(){return{version:1,step:0,furthest:0,rerolls:0,rolledKeys:{},values:{},rolls:{},nameTable:'female',swap:null,bonus:null,packing:{},notes:''}}
let state=fresh();try{const saved=JSON.parse(localStorage.getItem(STORAGE));if(saved?.version===1&&saved.values&&saved.rolls&&saved.packing&&Number.isInteger(saved.step)&&saved.step>=0&&saved.step<STEPS.length)state={...fresh(),...saved};}catch(e){}
const $=id=>document.getElementById(id);function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function die(sides){const a=new Uint32Array(1),limit=Math.floor(4294967296/sides)*sides;do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%sides+1}
function dice(n,sides){return Array.from({length:n},()=>die(sides))}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state));$('saved').textContent='Saved on this device'}catch(e){$('saved').textContent='Progress kept in this tab'}}
function active(){return STEPS[state.step]}function scores(){const v=state.values,out={str:v.str,dex:v.dex,wil:v.wil};if(state.swap)[out[state.swap[0]],out[state.swap[1]]]=[out[state.swap[1]],out[state.swap[0]]];return out}
function choices(table,n){return RANGES[table]?RANGES[table].find(r=>n>=r[0]&&n<=r[1])[2]:[TABLES[table][n-1]]}
function labelTable(t){return({tools:'Tools',trinkets:'Trinkets',expedition:'Expeditionary gear',armor:'Armor',weapons:'Weapons',spells:'Spellbooks'})[t]||cap(t)}
function roll(table){const n=die(table==='spells'?100:TABLES[table]?.length||20);return{n,choices:choices(table,n)}}
function recordRoll(key,previous){if(state.rolledKeys[key]||previous)state.rerolls++;state.rolledKeys[key]=true}
function reroll(){const st=active(),k=st.key;recordRoll(k,state.rolls[k]!=null);state.packing={};if(k==='name'){const n=die(20),s=die(20);state.values.name=TABLES[state.nameTable][n-1]+' '+TABLES.surname[s-1];state.rolls.name=`Given name ${n} · Surname ${s}`;}else if(['str','dex','wil','gold','hp','age'].includes(k)){let ds=dice(k==='age'?2:k==='hp'?1:3,k==='age'?20:6);state.values[k]=ds.reduce((a,b)=>a+b,0)+(k==='age'?10:0);state.rolls[k]=ds.join(' + ')+(k==='age'?' + 10':'')+' = '+state.values[k];if(['str','dex','wil'].includes(k))state.swap=null;}else{let r=roll(st.table);state.rolls[k]=r.n;if(k==='bonus'){state.bonus={...r,table:r.choices.length===1?r.choices[0]:null,result:null};delete state.values.bonus;}else state.values[k]=r.choices.length===1?r.choices[0]:null;}save();render();$('live').textContent='Rolled '+(state.values[k]||'a '+state.rolls[k]+'. Choose an option.');document.querySelector('[data-action="roll"]')?.focus()}
function item(name,id){const armor={Brigandine:1,Chainmail:2,Plate:3,Helmet:1,Shield:1},damage={Dagger:'d6',Cudgel:'d6',Staff:'d6',Sword:'d8',Mace:'d8',Axe:'d8',Longbow:'d6',Crossbow:'d8',Sling:'d4',Halberd:'d10','War Hammer':'d10',Battleaxe:'d10'};const bulky=['Brigandine','Chainmail','Plate','Longbow','Crossbow','Halberd','War Hammer','Battleaxe','Cart'].includes(name);return{id,name,slots:bulky?2:1,armor:armor[name]||0,body:['Brigandine','Chainmail','Plate'].includes(name),damage:damage[name],spell:name.startsWith('Spellbook: ')?name.slice(11):null}}
function gear(){const list=[item('Rations (3 days)','rations'),item('Torch','torch')];for(const k of ['armor','helmets','weapons','expedition','tools','trinkets','bonus']){const v=state.values[k];if(v&&v!=='None'){const names=v==='Helmet & Shield'?['Helmet','Shield']:[v];names.forEach((name,i)=>list.push(item(name,k+i)))}}const cart=list.find(x=>x.name==='Cart'&&state.packing[x.id]?.place!=='left');let bodyUsed=false;return list.map(x=>{const p=state.packing[x.id]||{};let equipped=!!x.armor&&(!x.body||!bodyUsed);if(x.body)bodyUsed=true;return{...x,place:p.place==='cart'&&!cart?'carry':p.place||'carry',equipped:p.equipped??equipped}})}
function totals(){const items=gear(),carried=items.filter(x=>x.place==='carry'),cart=items.some(x=>x.name==='Cart'&&x.place==='carry'),used=carried.reduce((s,x)=>s+x.slots,0),stored=items.filter(x=>x.place==='cart').reduce((s,x)=>s+x.slots,0);const equipped=carried.filter(x=>x.equipped&&x.armor);return{items,used,stored,cart,armor:Math.min(3,equipped.reduce((s,x)=>s+x.armor,0)),valid:used<=10&&stored<=(cart?4:0)&&equipped.filter(x=>x.body).length<=1&&equipped.filter(x=>x.name==='Helmet').length<=1&&equipped.filter(x=>x.name==='Shield').length<=1,hp:used>=10?0:state.values.hp}}
function ready(){const k=active().key;if(k==='swap'||k==='sheet')return true;if(k==='pack')return totals().valid;return state.values[k]!==undefined&&state.values[k]!==null&&String(state.values[k]).trim()!==''}
function tableMarkup(table,n){const rows=RANGES[table]?RANGES[table].map(([a,b,opts])=>({num:a===b?a:a+'–'+b,text:opts.map(x=>table==='bonus'?labelTable(x):x).join(' / '),hit:n>=a&&n<=b})):TABLES[table].map((text,i)=>({num:i+1,text,hit:n===i+1}));return `<details><summary>${esc(({female:'Female names',male:'Male names',surname:'Surnames'})[table]||labelTable(table))} · ${table==='spells'?'d100':'d'+(TABLES[table]?.length||20)} table</summary><ol class="table">${rows.map(r=>`<li class="${r.hit?'hit':''}"><b>${r.num}</b><span>${esc(r.text)}</span></li>`).join('')}</ol></details>`}
function options(opts,selected,action){return `<div class="options">${opts.map(x=>`<button data-action="${action}" data-value="${esc(x)}" class="${x===selected?'selected':''}" aria-pressed="${x===selected}">${esc(action==='bonus-table'?labelTable(x):x)}</button>`).join('')}</div>`}
function roller(st){const k=st.key,v=state.values[k],r=state.rolls[k];let html=`<div class="roller"><div class="roller-top"><span class="eyebrow">${k==='name'?'Name & surname':esc(k==='hp'?'Hit protection':cap(k))}</span><span class="dice-symbol" aria-hidden="true">⚄</span></div>`;
if(k==='name')html+=`<label class="field" for="name-table">Given-name table</label><select id="name-table"><option value="female" ${state.nameTable==='female'?'selected':''}>Female names</option><option value="male" ${state.nameTable==='male'?'selected':''}>Male names</option></select>`;
html+=`<div class="result ${v==null?'empty':''}">${esc(v??(r?'Choose below':'Still unwritten'))}</div><div class="roll-meta">${r!=null?esc(typeof r==='number'?'d'+(TABLES[st.table]?.length||20)+' → '+r:r):'Your next roll is waiting.'}</div><button class="primary roll-button" data-action="roll">${r!=null?'Roll again':'Roll '+(k==='name'?'name & surname':k==='age'?'2d20 + 10':['str','dex','wil','gold'].includes(k)?'3d6':k==='hp'?'1d6':'1d'+(TABLES[st.table]?.length||20))}</button>`;
if(k==='name')html+=`<label for="character-name" class="field">Make the name your own</label><input id="character-name" maxlength="80" autocomplete="off" value="${esc(v||'')}" placeholder="Character name">`;
if(k==='background')html+=`<label class="field" for="background-choice">Or choose a background</label><select id="background-choice"><option value="">Choose…</option>${TABLES.background.map(x=>`<option ${v===x?'selected':''}>${x}</option>`).join('')}</select>`;
if(st.table&&k!=='bonus'&&r&&choices(st.table,r).length>1)html+=`<p class="subtle">Pick one item for this result.</p>`+options(choices(st.table,r),v,'choice');
if(k==='bonus'&&state.bonus){const b=state.bonus;html+=`<h3>${b.choices.map(labelTable).join(' or ')}</h3>`;if(b.choices.length>1)html+=options(b.choices,b.table,'bonus-table');if(b.table){html+=`<button data-action="bonus-roll">${b.result?'Reroll':'Roll'} ${esc(labelTable(b.table))} · d${b.table==='spells'?100:20}</button>`;if(b.result){html+=`<p class="roll-meta">${esc(labelTable(b.table))} → ${b.result.n}</p>`;if(b.result.choices.length>1)html+=options(b.result.choices,v,'bonus-choice');if(v?.startsWith('Spellbook: '))html+=`<p class="subtle">${esc(SPELLS[v.slice(11)])}</p>`}html+=tableMarkup(b.table,b.result?.n)}}
if(st.table)html+=tableMarkup(st.table,r);if(k==='name')html+=tableMarkup(state.nameTable,null)+tableMarkup('surname',null);return html+'</div>'}
function swapView(){const s=scores();return `<div class="roller"><div class="stat-row">${['str','dex','wil'].map(k=>`<div class="stat"><small>${k.toUpperCase()}</small><strong>${s[k]}</strong></div>`).join('')}</div>${options(['STR ↔ DEX','STR ↔ WIL','DEX ↔ WIL'],state.swap?state.swap.map(k=>k.toUpperCase()).join(' ↔ '):null,'swap')}<button class="small" data-action="keep">Keep original rolls</button><p class="subtle">${state.swap?'One swap selected. Choosing another pair replaces this swap.':'Keeping all scores in their original order.'}</p></div>`}
function packView(){const t=totals();return `<div class="notice">${t.used}/10 personal slots${t.cart?' · '+t.stored+'/4 cart slots':''}. ${t.used>=10?'Full inventory reduces your current HP to 0.':'Current HP: '+t.hp+'.'}${!t.valid?' Resolve excess slots or duplicate equipped armor before continuing.':''}</div><p class="subtle">Armor counts only when worn or held (maximum 3). Equip one suit, one helmet, and one shield. Items begin at their listed slot size; agree any small-item bundles with your Warden.</p>${t.items.map(x=>`<div class="gear-row"><div><strong>${esc(x.name)}</strong><small>${x.slots} slot${x.slots>1?'s · bulky':''}${x.damage?' · '+x.damage+' damage':''}${x.armor?' · '+x.armor+' Armor':''}${x.name==='Cart'?' · +4 storage slots; needs both hands':''}</small>${x.armor?`<div><label><input type="checkbox" data-equip="${x.id}" ${x.equipped&&x.place==='carry'?'checked':''} ${x.place!=='carry'?'disabled':''}> Worn / held</label></div>`:''}</div><select aria-label="Location of ${esc(x.name)}" data-place="${x.id}"><option value="carry" ${x.place==='carry'?'selected':''}>Carry</option>${t.cart&&x.name!=='Cart'?`<option value="cart" ${x.place==='cart'?'selected':''}>In cart</option>`:''}<option value="left" ${x.place==='left'?'selected':''}>Leave behind</option></select></div>`).join('')}<label class="field" for="notes">Notes, bonds & a reason to adventure</label><textarea id="notes" maxlength="600" placeholder="What draws you into the unknown?">${esc(state.notes)}</textarea><p class="subtle">Gold is tracked separately. Your small starting purse is treated as pocket-sized. Longbow uses the equipment list’s bow damage (d6); Battleaxe uses the heavy-weapon profile (d10, bulky).</p>`}
function inventoryRows(items,capacity){let slot=1;const rows=[];for(const x of items){rows.push(`<tr><td>${slot}${x.slots===2?'–'+(slot+1):''}</td><td>${esc(x.name)}${x.equipped&&x.armor?' (worn/held)':''}</td><td>${x.damage|| (x.armor?x.armor+' Armor':x.slots===2?'bulky':'')}</td></tr>`);slot+=x.slots}while(slot<=capacity)rows.push(`<tr><td>${slot++}</td><td>&nbsp;</td><td></td></tr>`);return `<table class="inventory-table"><thead><tr><th>Slot</th><th>Item</th><th>Use</th></tr></thead><tbody>${rows.join('')}</tbody></table>`}
function sheetView(){const v=state.values,s=scores(),t=totals();return `<div class="screen-only"><button class="primary" data-action="print">Print / Save as PDF</button><p class="subtle">A4 portrait · also fits Letter with “Fit to page” · turn browser headers and footers off.</p></div><article class="sheet" aria-label="Character sheet"><div class="sheet-head"><h2>CAIRN</h2><span class="sheet-rerolls">${esc(state.rerolls ?? 0)} ${state.rerolls===1?'re-roll':'re-rolls'}</span><small>CHARACTER SHEET · FIRST EDITION</small></div><div class="sheet-name">${esc(v.name)}</div><div class="sheet-meta">${esc(v.background)} · Age ${v.age} <span style="float:right">Player: __________________</span></div><div class="sheet-stats">${[['STR',s.str],['DEX',s.dex],['WIL',s.wil],['HP',t.hp],['ARMOR',t.armor],['GOLD',v.gold]].map(([k,n])=>`<div class="sheet-stat">${k}<b>${n}</b><span class="write">${k==='HP'?'Max '+v.hp:k==='ARMOR'?'Max 3':k==='GOLD'?'gp':'Current: ____'}</span></div>`).join('')}</div><div class="sheet-cols"><section><h3>Appearance & character</h3><dl class="trait-list">${TRAITS.map(k=>`<dt>${cap(k)}</dt><dd>${esc(v[k])}</dd>`).join('')}</dl><h3>Notes, bonds & scars</h3><div class="notes-lines">${esc(state.notes)}</div><h3>At the table</h3><p><b>Saves.</b> Roll d20 ≤ ability. 1 always succeeds; 20 always fails.</p><p><b>Combat.</b> Roll weapon damage, subtract Armor, then lose HP. Damage beyond HP reduces STR; save STR to avoid critical damage. Exactly 0 HP from an attack: roll a Scar.</p><p><b>Recovery.</b> Brief rest and water restore HP. Ability loss usually needs a week’s rest and a healer. Deprived characters cannot recover.</p><p>Deprived □ &nbsp; Fatigue: ____ (1 slot each)</p></section><section><h3>Inventory · ${t.used}/10 slots</h3>${inventoryRows(t.items.filter(x=>x.place==='carry'),10)}<p>6 backpack · 2 hands · 2 upper body. Assign items to suit the situation. Bulky items use 2 slots. ${t.used>=10?'<b>Full inventory: current HP is 0.</b>':'At 10 occupied slots, current HP becomes 0.'}</p>${t.cart?`<h3>Cart · ${t.stored}/4 slots</h3>${inventoryRows(t.items.filter(x=>x.place==='cart'),4)}<p>Pulling the cart requires both hands.</p>`:''}${t.items.filter(x=>x.spell&&x.place!=='left').map(x=>`<div class="spell-block"><h3>${esc(x.spell)}</h3><p>${esc(SPELLS[x.spell])}</p><p>Hold the spellbook in both hands and read aloud; add 1 Fatigue. In danger or deprived, the Warden may require a WIL save.</p></div>`).join('')}</section></div><div class="sheet-footer">Cairn by Yochai Gal · cairnrpg.com · Rules and tables CC BY-SA 4.0 · Unofficial character-sheet adaptation, same license.<br>Unarmed d4 · Impaired d4 · Enhanced d12 · Multiple attacks against one target: roll all damage dice, keep the highest.</div></article>`}
function updateSummary(){const v=state.values,s=scores(),t=totals();$('summary').innerHTML=`<div class="summary-card"><div class="eyebrow">Your adventurer</div><h2>${esc(v.name||'An unwritten story')}</h2><div class="subtle">${esc(v.background||'Background unknown')}${v.age?' · '+v.age+' years':''}</div><div class="stat-row">${['str','dex','wil'].map(k=>`<div class="stat"><small>${k.toUpperCase()}</small><strong>${s[k]??'—'}</strong></div>`).join('')}</div><dl><dt>Hit protection</dt><dd>${v.hp!=null?t.hp:'—'}</dd><dt>Gold pieces</dt><dd>${v.gold??'—'}</dd><dt>Armor</dt><dd>${v.armor!=null?t.armor:'—'}</dd></dl><p class="summary-traits">${TRAITS.filter(k=>v[k]).map(k=>esc(v[k])).join(' · ')||'The dice will tell your story.'}</p><div class="subtle">${Math.min(state.furthest,STEPS.length-1)} of ${STEPS.length-1} steps completed</div></div>`}
function render(){$('reroll-tracker').hidden=state.rerolls<1;$('reroll-tracker').textContent=state.rerolls+' '+(state.rerolls===1?'re-roll':'re-rolls');const st=active(),finished=st.key==='sheet';document.body.classList.toggle('finished',finished);$('main').classList.toggle('sheet-wide',finished);$('summary').style.display=finished?'none':'';$('chapters').innerHTML=GROUPS.map((g,i)=>{let index=STEPS.findIndex(x=>x.group===i);return `<button data-step="${index}" ${index>state.furthest?'disabled':''} ${st.group===i?'aria-current="step"':''}><span>0${i+1}</span>${g}</button>`}).join('');$('main').innerHTML=`<div class="progress"><i style="width:${state.step/(STEPS.length-1)*100}%"></i></div><div class="eyebrow">${finished?'The journey begins':'Step '+(state.step+1)+' of '+(STEPS.length-1)+' · '+GROUPS[st.group]}</div><h1 tabindex="-1">${st.title}</h1><p class="intro">${st.info}</p>${st.key==='swap'?swapView():st.key==='pack'?packView():finished?sheetView():roller(st)}<div class="navigation"><button data-action="back" ${state.step===0?'disabled':''}>Back</button>${!finished?`<button data-action="next" class="primary" ${!ready()?'disabled':''}>${st.key==='pack'?'Finish character':'Continue'} →</button>`:''}</div>`;updateSummary()}
function go(index){if(index>state.step){for(let i=0;i<index;i++){const old=state.step;state.step=i;const ok=ready();state.step=old;if(!ok){index=i;break}}}state.step=index;save();render();$('main').querySelector('h1').focus();window.scrollTo({top:0,behavior:'instant'})}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.step!==undefined){go(Number(b.dataset.step));return}const a=b.dataset.action,k=active().key;if(a==='roll')reroll();else if(a==='next'&&ready()){state.furthest=Math.max(state.furthest,state.step+1);go(state.step+1)}else if(a==='back')go(Math.max(0,state.step-1));else if(a==='choice'){state.values[k]=b.dataset.value;save();render()}else if(a==='swap'){state.swap=b.dataset.value.toLowerCase().split(' ↔ ');save();render()}else if(a==='keep'){state.swap=null;save();render()}else if(a==='bonus-table'){state.bonus.table=b.dataset.value;state.bonus.result=null;delete state.values.bonus;state.packing={};save();render()}else if(a==='bonus-roll'){recordRoll('bonus-item',state.bonus.result!=null);const r=roll(state.bonus.table);state.bonus.result=r;state.values.bonus=r.choices.length===1?(state.bonus.table==='spells'?'Spellbook: ':'')+r.choices[0]:null;state.packing={};save();render();$('live').textContent='Bonus roll: '+(state.values.bonus||r.n)}else if(a==='bonus-choice'){state.values.bonus=b.dataset.value;state.packing={};save();render()}else if(a==='print'){document.title=(state.values.name||'Cairn')+' — Cairn Character';window.print()}});
document.addEventListener('input',e=>{if(e.target.id==='character-name'){state.values.name=e.target.value;save();updateSummary();document.querySelector('[data-action="next"]').disabled=!ready()}if(e.target.id==='notes'){state.notes=e.target.value;save()}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='name-table'){state.nameTable=el.value;save();render()}if(el.id==='background-choice'){state.values.background=el.value;state.rolls.background=null;save();render()}if(el.dataset.place){const id=el.dataset.place;const existing=gear().find(x=>x.id===id);state.packing[id]={...state.packing[id],equipped:existing.equipped,place:el.value};save();render()}if(el.dataset.equip){const id=el.dataset.equip;state.packing[id]={...state.packing[id],equipped:el.checked};save();render()}});
$('restart').addEventListener('click',()=>{if(confirm('Start a new character? This replaces the character saved on this device.')){state=fresh();save();render()}});
render();
</script></body></html>
